name: Pubblica comparatore su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara il sito
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f .nojekyll
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -xf - -C _site
          test -f _site/index.html
          echo "File pubblicati: $(find _site -type f | wc -l)"

      - name: Carica l'artefatto GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
