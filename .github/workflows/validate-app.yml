name: Verifica applicazione e dati territoriali
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'green-*.js'
      - 'data/green/*.json'
      - 'data/green/*.geojson'
      - 'data/verde_confronto_278_prg.json'
      - 'data/geo/verde_comunale_2013.geojson'
      - 'data/geo/verde_prg.geojson'
      - 'data/geo/copernicus_verde_accessibile_2021.geojson'
      - 'data/geo/osm_verde_accessibile_2025.geojson'
      - 'tools/*.py'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica sintassi JavaScript
        run: |
          node --check app.js
          for file in green-*.js; do node --check "$file"; done
      - name: Verifica sintassi Python
        run: python3 -m py_compile tools/*.py
      - name: Verifica whitespace e patch
        run: git diff --check
      - name: Audit integrità dei dataset territoriali
        run: python3 tools/qa_dataset_integrity.py
      - name: Verifica presenza dei layer PRG pubblicati
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=pathlib.Path('data/geo/prg')
          required=['prg_320_vg_zonizzazione.geojson','prg_vincoli_areali.geojson','prg_vincoli_lineari.geojson','metadata.json','qa_prg.json']
          missing=[x for x in required if not (d/x).is_file()]
          if missing: raise SystemExit('Layer PRG mancanti: '+', '.join(missing))
          qa=json.loads((d/'qa_prg.json').read_text(encoding='utf-8'))
          if qa.get('status')!='passed': raise SystemExit('QA PRG non superata')
          print('Layer PRG presenti; QA preliminare superata.')
          PY
