name: Acquisizione dati demografici ISTAT 2023
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/istat-demografia.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il pacchetto ufficiale ISTAT
        run: |
          curl -fL --retry 3 --retry-delay 5 "https://esploradati.istat.it/databrowser/DWL/PERMPOP/SUBCOM/Comuni_2023.zip" -o /tmp/Comuni_2023.zip
      - name: Ispeziona struttura del file Palermo
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import zipfile, io, openpyxl, json
          z=zipfile.ZipFile('/tmp/Comuni_2023.zip')
          b=z.read('Comuni_2023/Palermo_2023_sezioni.xlsx')
          w=openpyxl.load_workbook(io.BytesIO(b), read_only=True, data_only=True)
          print('SHEETS',w.sheetnames)
          for s in w:
              print('SHEET',s.title,'ROWS',s.max_row,'COLS',s.max_column)
              for row in s.iter_rows(min_row=1,max_row=min(8,s.max_row),values_only=True):
                  print('ROW',json.dumps(row,ensure_ascii=False,default=str))
          PY
