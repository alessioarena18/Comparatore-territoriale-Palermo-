name: Acquisizione cartografia PRG Palermo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/acquisisci_prg_comune.py'
      - 'tools/convert_prg_shapefiles.py'
      - 'tools/qa_prg_geojson.py'
      - '.github/workflows/acquisisci-prg.yml'
  schedule:
    - cron: '17 4 1 * *'
concurrency:
  group: prg-cartography-acquisition
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  acquire-convert-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip
      - name: Download and convert official datasets
        run: python3 tools/acquisisci_prg_comune.py
      - name: Syntax checks
        run: |
          node --check app.js
          python3 -m py_compile tools/acquisisci_prg_comune.py tools/convert_prg_shapefiles.py tools/qa_prg_geojson.py
      - name: Structural and geographic QA
        run: python3 tools/qa_prg_geojson.py
      - name: Upload source layers and QA report
        uses: actions/upload-artifact@v4
        with:
          name: prg-palermo-geojson-${{ github.run_number }}
          path: data/geo/prg/
          if-no-files-found: error
          retention-days: 30
      - name: Commit validated GeoJSON if repository size allows
        run: |
          SIZE=$(du -sb data/geo/prg | cut -f1)
          echo "PRG output size: $SIZE bytes"
          if [ "$SIZE" -gt 85000000 ]; then
            echo "Output exceeds 85 MB: artifact retained, automatic commit skipped."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo/prg/*.geojson data/geo/prg/*.json
          if git diff --cached --quiet; then
            echo "No PRG data changes."
          else
            git commit -m "Update official Palermo PRG layers and QA metadata"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
